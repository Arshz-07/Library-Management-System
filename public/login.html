<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | LibroSphere Library</title>
    <link rel="stylesheet" href="/css/variables.css">
    <link rel="stylesheet" href="/css/global.css">
</head>
<body style="background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); min-height: 100vh; display: flex; flex-direction: column;">

    <!-- Navbar -->
    <header class="navbar" style="background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); border-bottom: 1px solid rgba(255, 255, 255, 0.1);">
        <div class="container nav-container">
            <a href="/index.html" class="brand" style="color: white;">
                <div class="brand-icon">📚</div>
                <span>LibroSphere</span>
            </a>
            <div>
                <a href="/index.html" style="color: #cbd5e1; font-size: 0.9rem; font-weight: 600;">&larr; Back to Catalog</a>
            </div>
        </div>
    </header>

    <!-- Main Login Card -->
    <main style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1.5rem;">
        <div style="background: white; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); padding: 2.5rem; width: 100%; max-width: 440px;">
            
            <div style="text-align: center; margin-bottom: 2rem;">
                <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📖</div>
                <h1 style="font-size: 1.6rem; font-weight: 800; letter-spacing: -0.5px;">Welcome to LibroSphere</h1>
                <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Sign in with your library card ID or email</p>
            </div>

            <!-- 1-Click Demo Accounts -->
            <div style="background: var(--bg-surface-alt); border-radius: var(--radius-md); padding: 1rem; margin-bottom: 1.5rem; border: 1px solid var(--border-light);">
                <div style="font-size: 0.75rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 0.5rem; text-align: center;">
                    ⚡ 1-Click Demo Accounts
                </div>
                <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.demoLogin('admin')" title="Sign in as Administrator">
                        👑 Admin
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.demoLogin('librarian')" title="Sign in as Staff Librarian">
                        📚 Librarian
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" onclick="Auth.demoLogin('member')" title="Sign in as Student Reader">
                        🎓 Student
                    </button>
                </div>
            </div>

            <!-- Credentials Form -->
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Email or Member Card ID</label>
                    <input type="text" id="login-identifier" class="form-input" required placeholder="e.g. admin@librosphere.org or MEM-201" autofocus>
                </div>

                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem; padding: 0.75rem;">
                    Sign In to Portal
                </button>
            </form>

            <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-muted);">
                Don't have a library card yet?
                <a href="/register.html" style="color: var(--primary); font-weight: 700; text-decoration: underline;">Register here</a>
            </div>

        </div>
    </main>

    <!-- Scripts -->
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                const user = await Auth.login(identifier, password);
                if (user.role === 'admin' || user.role === 'librarian') {
                    window.location.href = '/admin.html';
                } else {
                    window.location.href = '/my-loans.html';
                }
            } catch (err) {
                showToast(err.message, 'error');
            }
        }
    </script>
</body>
</html>
